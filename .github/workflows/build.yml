name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Make build script executable
        run: chmod +x scripts/build-ipa.sh

      - name: Build IPA
        run: ./scripts/build-ipa.sh Release

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOSCustomize-unsigned
          path: build/iOSCustomize.ipa
          if-no-files-found: error # Báo lỗi nếu không có file IPA