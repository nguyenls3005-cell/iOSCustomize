name: iOSCustomize

options:
  bundleIdPrefix: com.lsnguyen
  createIntermediateGroups: true
  groupSortPosition: top
  postGenCommand: python3 scripts/sync-pbxproj-sources.py

packages:
  Minimuxer:
    path: Vendor

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    LM_SKIP_METADATA_EXTRACTION: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: layout/GoldenNuggetMobile.app/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.lsnguyen.ioscustom
    PRODUCT_NAME: iOSCustomize
    CODE_SIGN_ENTITLEMENTS: entitlements.plist
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: L7HX85L6GU
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: none
  configs:
    Release:
      COPY_PHASE_STRIP: YES

targets:
  iOSCustomize:
    type: application
    platform: iOS
    sources:
      - path: Nugget
      - path: layout/GoldenNuggetMobile.app/Assets.xcassets
        buildPhase: resources
      - path: layout/GoldenNuggetMobile.app/Assets.xcassets/AppIcon.icon
        buildPhase: resources
        createIntermediateGroups: false
      - path: layout/GoldenNuggetMobile.app/Logo@2x.png
        buildPhase: resources
      - path: layout/GoldenNuggetMobile.app/Logo@1x.png
        buildPhase: resources
    dependencies:
      - package: Minimuxer
        product: Minimuxer
      - package: Minimuxer
        product: ZIPFoundation
      - package: Minimuxer
        product: AirliftFFI
      - sdk: libsqlite3.tbd
      - sdk: WebKit.framework
    settings:
      base:
        OTHER_LDFLAGS:
          - "-framework"
          - "UIKit"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  iOSCustomize:
    build:
      targets:
        iOSCustomize: all
    run:
      config: Debug